services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ease_courier
      POSTGRES_USER: courier_app
      POSTGRES_PASSWORD: courier_local_password
    ports:
      - "5432:5432"
    volumes:
      - courier-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier_app -d ease_courier"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - courier-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  courier-postgres-data:
  courier-redis-data:
